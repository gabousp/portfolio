<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {{ if .Title }}
            {{ .Title }} — Gabriel Negreiros
        {{ else }}
            Gabriel Negreiros
        {{ end }}
    </title>

    {{ $css := resources.Get "css/main.css" | minify | fingerprint }}
    <link rel="stylesheet" href="{{ $css.RelPermalink }}">
</head>

<body>

<header>
    <nav>
        <a href="{{ "/" | relURL }}">Gabriel Negreiros</a>

        <div>
            <a href="{{ site.BaseURL }}#sobre">Sobre</a>
            <a href="{{ site.BaseURL }}#experiencias">Experiências</a>
            <a href="{{ site.BaseURL }}#projetos">Projetos</a>
            <a href="{{ site.BaseURL }}#formacao">Formação acadêmica</a>
            <a href="{{ site.BaseURL }}#competencias">Ferramentas</a>
            <a href="{{ site.BaseURL }}#contato">Contato</a>
        </div>
    </nav>
</header>

<main>
    {{ block "main" . }}{{ end }}
</main>

<footer>
    <p>© {{ now.Year }} Gabriel Negreiros</p>
</footer>

</body>
</html>
