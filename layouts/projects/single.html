{{ define "main" }}

<article class="project">

    <a href="{{ "/" | relURL }}#projetos" class="back">
        ← Voltar para projetos
    </a>

    <header class="project-header">

        <p class="eyebrow">PROJETO</p>

        <h1>{{ .Title }}</h1>

        <p class="subtitle">
            {{ .Description }}
        </p>

    </header>

    <div class="project-content">
        {{ .Content }}
    </div>

    <footer class="page-footer">
        <a href="{{ "/" | relURL }}#projetos">← Voltar aos projetos</a>
        <a href="{{ "/" | relURL }}#experiencias">Ver experiências →</a>
    </footer>

</article>

{{ end }}
